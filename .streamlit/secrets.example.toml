# OPTIONAL CONTACT CONFIGURATION — do not commit real passwords or API keys.
# Copy to .streamlit/secrets.toml locally, or enter these values
# in your Streamlit Community Cloud app's Settings > Secrets section.
# Without this section, the Contact form still allows an .eml draft download.
# With recipient alone, it opens an email-client draft instead of sending.

[contact]
recipient = "you@example.com"  # replace with your REAL contact address
# sender = "you@example.com"
# host = "smtp.example.com"
# port = 587
# username = "you@example.com"
# password = "YOUR_SMTP_APP_PASSWORD"
# use_ssl = false
